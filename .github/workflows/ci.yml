name: MoonDTA
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1.23
        with:
          version: '0.10.13+cbb11c36f'
          core-version: '0.10.13+cbb11c36f'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: moon version --all
      - run: moon fmt --check
      - run: moon check --target js --deny-warn
      - run: moon check --target wasm-gc --deny-warn
      - run: moon test --target js
      - run: moon test --target wasm-gc
      - run: moon build --target js
      - run: python -m pip install -r tests/requirements.txt
      - run: python tests/interop.py
      - run: python tests/wide.py
      - run: python tests/package_consumer.py
